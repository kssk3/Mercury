name: Codex 리뷰 확인

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: '확인할 PR 번호 (양의 정수)'
        required: true
        type: string
      decision:
        description: '리뷰 확인 상태: 대기, 소유자 승인, 수정 필요'
        required: true
        type: choice
        default: pending
        options: [pending, approved, changes_requested]
      reviewed-sha:
        description: '리뷰한 전체 40자리 HEAD SHA (승인 또는 수정 필요 선택 시 필수)'
        required: false
        type: string
      confirmation:
        description: '네이티브 Codex 리뷰가 완료되었고 병합을 막는 지적을 해결했음을 확인합니다'
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: codex-review-pr-${{ github.event.pull_request.number || inputs['pr-number'] }}
  cancel-in-progress: false

jobs:
  review-gate:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'kssk3' && github.repository_owner == 'kssk3' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: 신뢰할 수 있는 기본 또는 대상 브랜치 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 리뷰 게이트 동작 검증
        run: node --test .github/scripts/codex-review-gate.test.cjs
      - name: 현재 커밋의 리뷰 확인 상태 기록
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { runGate } = require('./.github/scripts/codex-review-gate.cjs');
            await runGate({ github, context, core });
